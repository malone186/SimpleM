# Cloud Run 환경변수 예시 — 복사해서 env.yaml로 만들고 실제 값 채우기 (env.yaml은 커밋 금지)
#   cp backend/deploy/env.example.yaml backend/deploy/env.yaml
# 사용: gcloud run deploy simplem-api --env-vars-file backend/deploy/env.yaml ...
DATABASE_URL: "postgresql://user:password@ep-xxxx-pooler.<region>.aws.neon.tech/neondb?sslmode=require"
DB_CONNECT_TIMEOUT: "10"
SECRET_KEY: "python -c \"import secrets; print(secrets.token_urlsafe(48))\" 로 생성"
GEMINI_API_KEY: "aistudio.google.com에서 발급 (챗봇·리포트·OCR 공용)"
GEMINI_MODEL: "gemini-3.1-flash-lite"
# OCR_GEMINI_MODEL: "gemini-2.5-flash"   # OCR 모델만 따로 바꿀 때
# --- 홍보 이미지 생성 (pollinations → gemini 순서로 시도) ---
# Pollinations는 Pollen 크레딧 지갑 방식이라 익명 호출은 402로 막힌다.
# enter.pollinations.ai에서 GitHub 로그인 → API 키 발급 필수 (가입 퀘스트 1.25 Pollen ≈ 1,200장).
# POLLINATIONS_TOKEN: ""
# MARKETING_IMAGE_API_KEY: ""   # 이미지 전용 유료 Gemini 키 (Gemini 무료 한도는 0)
# 만든 홍보 이미지를 영구 보관할 GCS 버킷. Cloud Run 디스크는 배포·스케일 때마다
# 날아가므로 실사용자를 받으려면 필수다. us-central1 버킷이면 상시 무료 한도 안이라 0원.
# 버킷은 공개 읽기여야 앱이 바로 불러온다:
#   gcloud storage buckets add-iam-policy-binding gs://<버킷> \
#     --member=allUsers --role=roles/storage.objectViewer
# MARKETING_GCS_BUCKET: "brewnote-promo-images"
NAVER_CLIENT_ID: ""
NAVER_CLIENT_SECRET: ""
NCP_MAPS_CLIENT_ID: ""
NCP_MAPS_CLIENT_SECRET: ""
TAVILY_API_KEY: ""
FIREBASE_PROJECT_ID: "simplem-72f8d"
LANGSMITH_API_KEY: ""
ENV: "production"

# --- FCM 푸시 알림 (백엔드 B) ---
# 서비스 계정 JSON '내용 전체'를 한 줄로 넣는다 (Firebase 콘솔 > 프로젝트 설정 > 서비스 계정 >
# 새 비공개 키 생성). 진짜 비밀이므로 Cloud Run에서는 Secret Manager 사용을 권장한다:
#   gcloud secrets create fcm-sa --data-file=serviceAccountKey.json
#   gcloud run deploy ... --set-secrets=FCM_SERVICE_ACCOUNT_JSON=fcm-sa:latest
# 비워 두면 푸시 발송만 조용히 꺼지고 나머지 기능은 정상 동작한다.
FCM_SERVICE_ACCOUNT_JSON: ""
# Cloud Scheduler만 /api/v1/chatbot/notifications/run을 부를 수 있게 하는 공유 비밀.
# 비워 두면 그 엔드포인트는 404를 내 외부에 열리지 않는다.
#   python -c "import secrets; print(secrets.token_urlsafe(32))"
NOTIFICATION_CRON_SECRET: ""
