[pytest]
# 테스트는 tests/ 에만 있다. scripts/ 에도 test_*.py 가 몇 개 있는데 그건 손으로 돌리는
# 확인용 스크립트라 수집되면 import 단계에서 죽는다(선택 의존 미설치). 그래서 수집 범위를 묶는다.
testpaths = tests

# testpaths 는 인자 없이 `pytest` 만 쳤을 때만 먹는다. `pytest backend` 처럼 경로를 주면
# 무시되므로 폴더 자체도 빼둔다 (기본값을 덮어쓰는 설정이라 원래 항목도 같이 적는다).
norecursedirs = scripts .* build dist *.egg venv .venv node_modules

# `python -m pytest` 는 현재 폴더를 sys.path 에 넣어주지만 그냥 `pytest` 는 안 넣어준다.
# 둘 다 똑같이 돌게 backend 를 경로에 올린다 — 없으면 `pytest` 만 "No module named 'app'" 로 죽는다.
pythonpath = .
