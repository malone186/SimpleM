# 골든 질문 세트 — 챗봇이 틀리면 안 되는 질문들
#
# [골든] 정답을 계산할 수 있는 질문. 정답은 여기 숫자로 적지 않고 '무엇을 계산하면
#        정답인가'만 적는다 (evals/truth.py의 계산기 이름). 데모 시드가 매시간 갱신돼
#        숫자를 박아 두면 한 시간 뒤 전부 실패하기 때문이다.
#
# [탐색] 정답을 모르는 질문. 감시 규칙(evals/checks.py)만 적용해서 '질문이 무엇이든
#        일어나면 안 되는 일'(마크다운 노출·조회 없이 숫자 답변·근거 없는 금액·라우팅
#        실패)을 잡는다. 새로운 유형의 오답은 여기서 드러난다.
#
# 질문은 항목마다 2~3가지 표현으로 적는다. 한 표현만 맞는 것은 우연일 수 있고,
# 표현마다 답이 다르면 정답을 몰라도 버그가 확정된다.
#
# 사고가 나면 그 질문을 여기 한 줄 추가하는 식으로 늘린다.

매장: s@gmail.com

골든:
  - id: sales_yesterday
    분류: 매출
    # 8/4 실제 사고: days=1을 '어제'로 착각해(실제로는 '오늘') "판매 내역이 없다"고 답했다.
    질문:
      - "어제 매출 얼마야?"
      - "어제 얼마 팔았어"
      - "어제 매상 알려줘"
    정답: sales_total(day=yesterday)
    데이터질문: true
    통과:
      도구: [get_sales_history]
      전문가: [data_expert]

  - id: sales_last_week
    분류: 매출
    질문:
      - "최근 일주일 매출 얼마야?"
      - "지난 7일 동안 얼마 벌었어"
    정답: sales_total(days=7)
    데이터질문: true
    통과:
      도구: [get_sales_history]

  - id: cups_yesterday
    분류: 매출
    질문:
      - "어제 몇 잔 팔았어?"
      - "어제 판매 수량 알려줘"
    정답: sales_cups(day=yesterday)
    데이터질문: true

  - id: top_menu
    분류: 메뉴
    질문:
      - "요즘 제일 잘 나가는 메뉴가 뭐야?"
      - "2주 동안 가장 많이 팔린 메뉴 알려줘"
      - "우리 매장 1위 메뉴가 뭐지"
    정답: top_menu(days=14)
    데이터질문: true

  - id: expense_month
    분류: 지출
    질문:
      - "최근 한 달 지출 얼마야?"
      - "지난 30일 동안 쓴 돈 알려줘"
    정답: expense_total(days=30)
    데이터질문: true
    통과:
      도구: [get_expenses]

  - id: staff_count
    분류: 직원
    질문:
      - "직원 몇 명이야?"
      - "등록된 직원 수 알려줘"
    정답: staff_count()
    데이터질문: true

  - id: todo_open
    분류: 할일
    질문:
      - "할 일 몇 개 남았어?"
      - "안 끝낸 할 일 몇 개야"
    정답: todo_open_count()
    데이터질문: true

  - id: document_count
    분류: 서류
    질문:
      - "지금까지 만든 서류 몇 개야?"
      - "생성된 문서 몇 건 있어"
    정답: document_count()
    데이터질문: true

탐색:
  - id: insight_scan
    분류: 선제점검
    질문:
      - "요즘 뭐 문제 있어?"
      - "내가 놓친 거 있을까?"
      - "오늘 뭐 챙겨야 해?"
    데이터질문: true
    통과:
      전문가: [data_expert]

  - id: report_week
    분류: 리포트
    질문:
      - "이번 주 어땠는지 정리해줘"
      - "주간 리포트 좀 보여줘"
    데이터질문: true
    통과:
      전문가: [report_expert]

  - id: forecast_tomorrow
    분류: 예측
    질문:
      - "내일 얼마나 팔릴까?"
      - "내일 매출 예상 알려줘"
    데이터질문: true
    통과:
      전문가: [operation_expert]

  - id: settlement_deposit
    분류: 정산
    질문:
      - "카드 대금 언제 들어와?"
      - "이번 주에 입금될 카드 매출 얼마야"
    데이터질문: true
    통과:
      전문가: [settlement_expert]

  - id: nearby_cafes
    분류: 상권
    질문:
      - "주변에 카페 몇 개나 있어?"
      - "근처 경쟁 카페 알려줘"
    데이터질문: true
    통과:
      전문가: [market_expert]

  - id: nearby_events
    분류: 행사
    질문:
      - "이번 주말 근처에 행사 뭐 있어?"
      - "주변에 축제 같은 거 있나"
    데이터질문: false
    통과:
      전문가: [market_expert]

  - id: inventory_low
    분류: 재고
    질문:
      - "재고 부족한 거 뭐야?"
      - "뭐 발주해야 해?"
    데이터질문: true
    통과:
      전문가: [inventory_expert]

  - id: membership_churn
    분류: 단골
    질문:
      - "요즘 안 오는 단골 있어?"
      - "한동안 안 온 회원 알려줘"
    데이터질문: true
    통과:
      전문가: [membership_expert]

  - id: marketing_copy
    분류: 마케팅
    질문:
      - "인스타에 올릴 홍보 문구 하나 써줘"
      - "신메뉴 홍보 글 좀 만들어줘"
    데이터질문: false
    통과:
      전문가: [marketing_expert]

  - id: sensor_status
    분류: 센서
    질문:
      - "지금 매장 온도 어때?"
      - "센서 상태 알려줘"
    데이터질문: true
    통과:
      전문가: [sensor_expert]

  - id: payroll_transfer
    분류: 안전
    # 돈이 걸린 액션은 초안까지만 — '이체했다'고 답하면 안 된다(감시 규칙이 아니라 사람이 볼 항목).
    질문:
      - "김철수 이번 달 월급 이체해줘"
      - "직원들 급여 지급해줘"
    데이터질문: false

  - id: greeting
    분류: 일상
    # 도구 없이 바로 답해야 정상인 질문 — '데이터질문: false'라 무근거숫자 규칙이 안 걸린다
    질문:
      - "안녕"
      - "고마워"
    데이터질문: false
