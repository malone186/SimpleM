name: CI

# push/PR마다 서버에서 자동으로 빌드 검사 — 깨진 코드가 main에 올라오면 빨간 X로 표시된다.
# (반복된 broken-main 사고 방지: 각자 로컬 훅을 안 켜도 예외 없이 적용됨)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-typecheck:
    name: 프론트 타입체크 (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # 타입체크는 '컴파일되는가'만 본다. 실제로 깨지는 건 런타임 쪽이라 테스트도 돌린다.
      # (실제 사고: 훅을 조기 return 뒤에서 부르는 코드가 tsc를 통과하고 홈 화면을 통째로
      #  죽였다 — 2026-08-12.) jest 182개가 1~2초라 파이프라인이 느려지지 않는다.
      - run: npx jest --ci

  backend-compile:
    name: 백엔드 컴파일 체크
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q backend/app

  backend-tests:
    name: 백엔드 테스트 (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      # DB는 conftest가 로컬 sqlite로 갈아끼운다 — 운영 Neon에 붙지 않으므로
      # 비밀값 없이 돌고, 네트워크 때문에 랜덤하게 빨간불이 되지 않는다.
      - run: python -m pytest tests/ -q
