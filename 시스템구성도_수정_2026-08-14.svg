<text x="1022" y="288" font-size="11" fill="#6F6357">· 홍보 이미지 영구 보관</text>
<text x="1022" y="306" font-size="11" fill="#6F6357">· 선택적 — 버킷 미설정이면</text>
<text x="1022" y="324" font-size="11" fill="#6F6357">   로컬 디스크로 폴백</text>

<rect x="1010" y="354" width="210" height="140" rx="9" fill="#F4EEFF" stroke="#CFC0EE" stroke-width="1.2"/>
<text x="1022" y="378" font-size="12.5" font-weight="700" fill="#573BA5">컨테이너 로컬 디스크</text>
<text x="1022" y="398" font-size="11" fill="#A62F45">· 휘발성 — 배포마다 초기화</text>
<text x="1022" y="416" font-size="11" fill="#6F6357">· 업로드 파일 · TTS 캐시</text>
<text x="1022" y="434" font-size="11" fill="#6F6357">· Chroma 벡터 인덱스</text>
<text x="1022" y="452" font-size="11" fill="#6F6357">   (라이브러리 — 별도 서비스 아님)</text>
<text x="1022" y="470" font-size="11" fill="#6F6357">· 홍보 이미지 폴백 저장</text>

<rect x="1010" y="504" width="210" height="82" rx="9" fill="#FFEDF0" stroke="#F2BFC6" stroke-width="1.2"/>
<text x="1022" y="528" font-size="12" font-weight="700" fill="#A62F45">⚠ 휘발성 주의</text>
<text x="1022" y="548" font-size="10.5" fill="#6F6357">Chroma 인덱스·캐시는 새 배포에서</text>
<text x="1022" y="564" font-size="10.5" fill="#6F6357">비워진다 — 재색인으로 복구</text>

