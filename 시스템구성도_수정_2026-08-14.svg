<!-- ③ 수동 레인 — 커밋에서 곧장 갈라진다 (검사·배포 파이프라인을 거치지 않으므로 점선) -->
<rect x="530" y="906" width="560" height="60" rx="9" fill="#FFF2E6" stroke="#F0C9A0" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="544" y="931" font-size="12" font-weight="700" fill="#A25711">③ 안드로이드 앱 → 수동 (파이프라인 밖)</text>
<text x="544" y="949" font-size="10.5" fill="#6F6357">eas build --profile production → AAB → Play  ·  eas update → OTA (JS·에셋만)</text>

<rect x="1120" y="766" width="370" height="200" rx="9" fill="#FFEDF0" stroke="#F2BFC6" stroke-width="1.2"/>
