<text x="62" y="178" font-size="11" fill="#6F6357">· Cloud Run · brewnote-web</text>
<text x="62" y="196" font-size="11" fill="#6F6357">· 브라우저 접속 · 정적 번들</text>
<text x="62" y="214" font-size="11" fill="#A62F45">· 푸시 알림 미지원 — 코드로 차단</text>

<rect x="50" y="240" width="280" height="100" rx="9" fill="#F0F7EA" stroke="#C3DCB2" stroke-width="1.2"/>
<text x="62" y="264" font-size="12.5" font-weight="700" fill="#3D6B32">Android 앱 (Expo RN)</text>
<text x="62" y="284" font-size="11" fill="#6F6357">· EAS 빌드(AAB) · Play 배포 — 수동</text>
<text x="62" y="302" font-size="11" fill="#6F6357">· FCM 푸시 수신 (서버가 발송)</text>
<text x="62" y="320" font-size="11" fill="#6F6357">· OTA 업데이트 수신 (eas update)</text>

<rect x="50" y="350" width="280" height="100" rx="9" fill="#F0F7EA" stroke="#C3DCB2" stroke-width="1.2"/>
<text x="62" y="374" font-size="12.5" font-weight="700" fill="#3D6B32">관리자 콘솔 /console</text>
<text x="62" y="394" font-size="11" fill="#A62F45">· 별도 Cloud Run 배포가 아니다</text>
<text x="62" y="412" font-size="11" fill="#6F6357">· brewnote-api 안에 마운트된 정적 페이지</text>
<text x="62" y="430" font-size="11" fill="#6F6357">· 백엔드 배포에 같이 실려 나간다</text>

