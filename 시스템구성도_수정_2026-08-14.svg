<!-- 02 백엔드 -->
<rect x="532" y="100" width="440" height="600" rx="12" fill="#FFFFFF" stroke="#E6DCCD" stroke-width="1.5"/>
<text x="548" y="124" font-size="13" font-weight="700" fill="#1E4E8C">02 백엔드 (Backend) — Cloud Run · brewnote-api</text>

<rect x="544" y="134" width="416" height="78" rx="9" fill="#EAF2FF" stroke="#B8D0F0" stroke-width="1.2"/>
<text x="556" y="158" font-size="12.5" font-weight="700" fill="#1E4E8C">FastAPI 단일 서비스</text>
<text x="556" y="178" font-size="11" fill="#6F6357">· asia-northeast3 · 2Gi RAM · 1 vCPU · min-instances 1</text>
<text x="556" y="196" font-size="11" fill="#6F6357">· REST API (/api/v1) · 정적 마운트 (/console·/legal·/map)</text>

<rect x="544" y="222" width="416" height="196" rx="9" fill="#EAF2FF" stroke="#B8D0F0" stroke-width="1.2"/>
<text x="556" y="246" font-size="12.5" font-weight="700" fill="#1E4E8C">주요 서비스</text>
<text x="556" y="266" font-size="11" fill="#6F6357">· AI 에이전트 '브루' — Gemini 멀티에이전트 챗봇</text>
<text x="556" y="284" font-size="11" fill="#6F6357">   금전 액션(발주·지급·신고)은 초안(draft)만 만든다</text>
<text x="556" y="302" font-size="11" fill="#6F6357">· OCR — Gemini (영수증·거래명세서 → 재고·장부 반영)</text>
<text x="556" y="320" font-size="11" fill="#6F6357">· TTS — Gemini 보이스 4종 · WAV 캐시 · 분당 3회 제한</text>
<text x="556" y="338" font-size="11" fill="#6F6357">· 홍보 이미지 — Pollinations 생성 · GCS 보관</text>
<text x="556" y="356" font-size="11" fill="#6F6357">· Square 웹훅 수신 — 실시간 매출 반영 (서명 검증)</text>
<text x="556" y="374" font-size="11" fill="#6F6357">· 관리자 콘솔 /console — 정적 파일 서빙</text>
<text x="556" y="392" font-size="11" fill="#6F6357">· 리포트·예측·손익분기·게임화(코인) 서비스</text>

<rect x="544" y="428" width="416" height="120" rx="9" fill="#EAF2FF" stroke="#B8D0F0" stroke-width="1.2"/>
<text x="556" y="452" font-size="12.5" font-weight="700" fill="#1E4E8C">백그라운드 작업</text>
<text x="556" y="472" font-size="11" fill="#6F6357">· 원두 시세 스냅샷 — 6시간 간격 (하루 1회 기록)</text>
<text x="556" y="490" font-size="11" fill="#6F6357">· 행사 캐시 — 매일 새벽(4시 KST 이후) 갱신</text>
<text x="556" y="508" font-size="11" fill="#6F6357">· DB 자가치유 — 기동 시 1회</text>
<text x="556" y="526" font-size="11" fill="#A62F45">· POS 자동 폴링 — 기본 꺼짐 (실시간은 웹훅 담당)</text>

<rect x="544" y="558" width="416" height="126" rx="9" fill="#EAF2FF" stroke="#B8D0F0" stroke-width="1.2"/>
<text x="556" y="582" font-size="12.5" font-weight="700" fill="#1E4E8C">GCP 공통</text>
<text x="556" y="602" font-size="11" fill="#6F6357">· Secret Manager — fcm-sa 키 (FCM 푸시 발송용)</text>
<text x="556" y="620" font-size="11" fill="#6F6357">· Cloud Logging — stdout 자동 수집 (GCP에 저장)</text>
<text x="556" y="638" font-size="11" fill="#6F6357">· 정기 작업 엔드포인트 — CRON_SECRET 보호</text>
<text x="556" y="656" font-size="11" fill="#6F6357">   (Cloud Scheduler 등 외부 크론이 호출: POS·알림)</text>

<!-- 03 데이터 -->
