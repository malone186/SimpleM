<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="740" viewBox="0 0 1500 740" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<defs>
  <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B7A891"/></marker>
  <marker id="ahm" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#C99A63"/></marker>
</defs>
<rect width="1500" height="740" fill="#FAF7F2"/>

<text x="40" y="44" font-size="26" font-weight="800" fill="#2C2620">SimpleM · BrewNote — CI/CD 배포 흐름</text>
<text x="40" y="68" font-size="13" fill="#6F6357">main push 한 번 → 검사 3겹 → 세 갈래 배포. 서버·웹은 자동, 안드로이드 앱만 수동 · 2026-08-13</text>

<!-- 범례 -->
<rect x="1150" y="26" width="310" height="56" rx="10" fill="#FFFFFF" stroke="#E6DCCD" stroke-width="1.5"/>
<line x1="1166" y1="46" x2="1194" y2="46" stroke="#B7A891" stroke-width="2" marker-end="url(#ah)"/>
<text x="1210" y="50" font-size="11.5" fill="#6F6357">자동 — GitHub Actions가 실행</text>
<line x1="1166" y1="68" x2="1194" y2="68" stroke="#C99A63" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ahm)"/>
<text x="1210" y="72" font-size="11.5" fill="#6F6357">수동 — 사람이 직접 실행</text>

<!-- ① 트리거 -->
<rect x="40" y="100" width="200" height="96" rx="12" fill="#FFFFFF" stroke="#E6DCCD" stroke-width="1.5"/>
<text x="52" y="124" font-size="13" font-weight="700" fill="#8A6A45">① 트리거</text>
<rect x="50" y="134" width="180" height="52" rx="9" fill="#F5F2EC" stroke="#D9CDBB" stroke-width="1.2"/>
<text x="140" y="156" font-size="13" font-weight="700" text-anchor="middle" fill="#665741">커밋 · git push</text>
<text x="140" y="174" font-size="11" text-anchor="middle" fill="#6F6357">main에 직접 push</text>

<line x1="242" y1="160" x2="266" y2="160" stroke="#B7A891" stroke-width="2" marker-end="url(#ah)"/>

<!-- ② 검사 3겹 -->
<rect x="270" y="100" width="300" height="262" rx="12" fill="#FFFFFF" stroke="#E6DCCD" stroke-width="1.5"/>
<text x="282" y="124" font-size="13" font-weight="700" fill="#8A6A45">② 검사 3겹 — 층마다 막는 범위</text>
<rect x="282" y="134" width="276" height="70" rx="9" fill="#F0F7EA" stroke="#C3DCB2" stroke-width="1.2"/>
<text x="420" y="156" font-size="12.5" font-weight="700" text-anchor="middle" fill="#3D6B32">로컬 pre-push 훅</text>
<text x="420" y="174" font-size="11" text-anchor="middle" fill="#6F6357">바뀐 쪽만 — tsc / pytest 797</text>
<text x="420" y="192" font-size="11" text-anchor="middle" fill="#3D6B32">실패하면 push 자체가 막힌다</text>
<rect x="282" y="212" width="276" height="70" rx="9" fill="#F0F7EA" stroke="#C3DCB2" stroke-width="1.2"/>
<text x="420" y="234" font-size="12.5" font-weight="700" text-anchor="middle" fill="#3D6B32">CI · CI Check (Actions)</text>
<text x="420" y="252" font-size="11" text-anchor="middle" fill="#6F6357">충돌 마커 · tsc · jest 182 · pytest</text>
<text x="420" y="270" font-size="11" text-anchor="middle" fill="#A25711">빨간불만 — 배포를 막지는 못한다</text>
<rect x="282" y="290" width="276" height="70" rx="9" fill="#F0F7EA" stroke="#C3DCB2" stroke-width="1.2"/>
<text x="420" y="312" font-size="12.5" font-weight="700" text-anchor="middle" fill="#3D6B32">배포 잡 안의 게이트</text>
<text x="420" y="330" font-size="11" text-anchor="middle" fill="#6F6357">compileall · tsc --noEmit</text>
<text x="420" y="348" font-size="11" text-anchor="middle" fill="#3D6B32">실패하면 배포가 중단된다</text>

<!-- 분기 트렁크 -->
<line x1="572" y1="231" x2="600" y2="231" stroke="#B7A891" stroke-width="2"/>
<line x1="600" y1="169" x2="600" y2="327" stroke="#B7A891" stroke-width="2"/>
<line x1="600" y1="169" x2="630" y2="169" stroke="#B7A891" stroke-width="2" marker-end="url(#ah)"/>
<line x1="600" y1="327" x2="630" y2="327" stroke="#B7A891" stroke-width="2" marker-end="url(#ah)"/>

<!-- ③-A 백엔드 -->
<rect x="620" y="100" width="840" height="120" rx="12" fill="#FFFFFF" stroke="#E6DCCD" stroke-width="1.5"/>
<text x="636" y="124" font-size="13" font-weight="700" fill="#8A6A45">③-A  backend/** 변경 → 자동</text>
<rect x="636" y="134" width="240" height="70" rx="9" fill="#EAF2FF" stroke="#B8D0F0" stroke-width="1.2"/>
<text x="756" y="158" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1E4E8C">alembic upgrade head</text>
<text x="756" y="176" font-size="11" text-anchor="middle" fill="#6F6357">DB 마이그레이션</text>
<text x="756" y="192" font-size="11" text-anchor="middle" fill="#6F6357">배포 직전에 돈다</text>
<line x1="880" y1="169" x2="914" y2="169" stroke="#B7A891" stroke-width="2" marker-end="url(#ah)"/>
<rect x="920" y="134" width="240" height="70" rx="9" fill="#EAF2FF" stroke="#B8D0F0" stroke-width="1.2"/>
<text x="1040" y="158" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1E4E8C">Cloud Run · brewnote-api</text>
<text x="1040" y="176" font-size="11" text-anchor="middle" fill="#6F6357">gcloud run deploy --source</text>
<text x="1040" y="192" font-size="11" text-anchor="middle" fill="#6F6357">Cloud Build → Artifact Registry 내장</text>
<line x1="1164" y1="169" x2="1198" y2="169" stroke="#B7A891" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1204" y="134" width="240" height="70" rx="9" fill="#EAF2FF" stroke="#B8D0F0" stroke-width="1.2"/>
<text x="1324" y="158" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1E4E8C">/health 스모크 테스트</text>
<text x="1324" y="176" font-size="11" text-anchor="middle" fill="#6F6357">200까지 5회 재시도</text>
<text x="1324" y="192" font-size="11" text-anchor="middle" fill="#6F6357">실패하면 워크플로 빨간불</text>

<!-- ③-B 웹 -->
<rect x="620" y="256" width="840" height="120" rx="12" fill="#FFFFFF" stroke="#E6DCCD" stroke-width="1.5"/>
<text x="636" y="280" font-size="13" font-weight="700" fill="#8A6A45">③-B  frontend/** 변경 → 자동</text>
<rect x="636" y="290" width="240" height="70" rx="9" fill="#E8F6F5" stroke="#A9D8D6" stroke-width="1.2"/>
<text x="756" y="314" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1C6B68">백엔드 URL 주입</text>
<text x="756" y="332" font-size="11" text-anchor="middle" fill="#6F6357">EXPO_PUBLIC_API_BASE_URL</text>
<text x="756" y="348" font-size="11" text-anchor="middle" fill="#6F6357">빌드 시 번들에 박힌다</text>
<line x1="880" y1="325" x2="914" y2="325" stroke="#B7A891" stroke-width="2" marker-end="url(#ah)"/>
<rect x="920" y="290" width="240" height="70" rx="9" fill="#E8F6F5" stroke="#A9D8D6" stroke-width="1.2"/>
<text x="1040" y="314" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1C6B68">Cloud Run · brewnote-web</text>
<text x="1040" y="332" font-size="11" text-anchor="middle" fill="#6F6357">Expo 웹 빌드 → 배포</text>
<text x="1040" y="348" font-size="11" text-anchor="middle" fill="#6F6357">Cloud Build → Artifact Registry 내장</text>
<line x1="1164" y1="325" x2="1198" y2="325" stroke="#B7A891" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1204" y="290" width="240" height="70" rx="9" fill="#E8F6F5" stroke="#A9D8D6" stroke-width="1.2"/>
<text x="1324" y="314" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1C6B68">웹 200 확인</text>
<text x="1324" y="332" font-size="11" text-anchor="middle" fill="#6F6357">응답이 없으면</text>
<text x="1324" y="348" font-size="11" text-anchor="middle" fill="#6F6357">워크플로 빨간불</text>

<!-- ③-C 안드로이드 앱 -->
<rect x="40" y="412" width="1420" height="170" rx="12" fill="#FFFFFF" stroke="#E6DCCD" stroke-width="1.5"/>
<text x="56" y="436" font-size="13" font-weight="700" fill="#8A6A45">③-C  안드로이드 앱 → 수동 (파이프라인 밖)</text>

<rect x="60" y="470" width="200" height="62" rx="9" fill="#F5F2EC" stroke="#D9CDBB" stroke-width="1.2"/>
<text x="160" y="495" font-size="12.5" font-weight="700" text-anchor="middle" fill="#665741">개발자 로컬 터미널</text>
<text x="160" y="513" font-size="11" text-anchor="middle" fill="#6F6357">eas CLI 직접 실행</text>
<polyline points="262,501 285,501 285,478 302,478" fill="none" stroke="#C99A63" stroke-width="1.8" marker-end="url(#ahm)"/>
<polyline points="285,501 285,552 302,552" fill="none" stroke="#C99A63" stroke-width="1.8" marker-end="url(#ahm)"/>

<rect x="310" y="448" width="290" height="60" rx="9" fill="#FFF2E6" stroke="#F0C9A0" stroke-width="1.2"/>
<text x="455" y="472" font-size="12.5" font-weight="700" text-anchor="middle" fill="#A25711">eas build --profile production</text>
<text x="455" y="490" font-size="11" text-anchor="middle" fill="#6F6357">AAB → Play 업로드 · preview는 APK</text>
<line x1="604" y1="478" x2="638" y2="478" stroke="#C99A63" stroke-width="1.8" marker-end="url(#ahm)"/>
<rect x="644" y="448" width="290" height="60" rx="9" fill="#FFF2E6" stroke="#F0C9A0" stroke-width="1.2"/>
<text x="789" y="472" font-size="12.5" font-weight="700" text-anchor="middle" fill="#A25711">새 앱 버전 설치</text>
<text x="789" y="490" font-size="11" text-anchor="middle" fill="#6F6357">네이티브·권한이 바뀌면 이 경로뿐</text>

<rect x="310" y="522" width="290" height="60" rx="9" fill="#FFF2E6" stroke="#F0C9A0" stroke-width="1.2"/>
<text x="455" y="546" font-size="12.5" font-weight="700" text-anchor="middle" fill="#A25711">eas update</text>
<text x="455" y="564" font-size="11" text-anchor="middle" fill="#6F6357">JS·에셋만 — 빌드를 거치지 않는다</text>
<line x1="604" y1="552" x2="638" y2="552" stroke="#C99A63" stroke-width="1.8" marker-end="url(#ahm)"/>
<rect x="644" y="522" width="290" height="60" rx="9" fill="#FFF2E6" stroke="#F0C9A0" stroke-width="1.2"/>
<text x="789" y="546" font-size="12.5" font-weight="700" text-anchor="middle" fill="#A25711">OTA 업데이트</text>
<text x="789" y="564" font-size="11" text-anchor="middle" fill="#6F6357">설치된 앱이 다음 실행에 받는다</text>

<rect x="970" y="448" width="470" height="134" rx="10" fill="#FFEDF0" stroke="#F2BFC6" stroke-width="1.2"/>
<text x="988" y="472" font-size="12.5" font-weight="700" fill="#A62F45">⚠ 자동화 사각지대 — 앱은 따라오지 않는다</text>
<text x="988" y="496" font-size="11.5" fill="#6F6357">· main에 push해도 앱은 그대로다 (서버·웹만 최신이 된다)</text>
<text x="988" y="518" font-size="11.5" fill="#6F6357">· 백엔드 URL이 바뀌면 eas.json도 같이 고쳐 다시 빌드해야 한다</text>
<text x="988" y="540" font-size="11.5" fill="#6F6357">· 지금 푸시 알림이 이 상태 — 코드·서버는 나갔지만 앱 빌드를</text>
<text x="998" y="558" font-size="11.5" fill="#6F6357">안 해서 사용자에게는 아직 없는 기능이다</text>

<!-- 패널을 가로지르는 연결선은 맨 마지막에 그린다 — 앞서 그리면 뒤에 오는 흰 패널이 화살촉을 덮는다 -->
<!-- api → web 의존: 웹 빌드가 api의 Cloud Run URL을 읽어 간다 -->
<polyline points="1040,204 1040,238 756,238 756,286" fill="none" stroke="#B7A891" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="898" y="232" font-size="11" text-anchor="middle" fill="#6F6357">api가 먼저 떠 있어야 URL을 읽을 수 있다</text>

<!-- 커밋 → 수동 경로: 같은 소스에서 갈라지지만 사람이 따로 실행한다 -->
<line x1="140" y1="188" x2="140" y2="466" stroke="#C99A63" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ahm)"/>
<text x="150" y="330" font-size="10.5" fill="#A25711">같은 소스</text>
<text x="150" y="346" font-size="10.5" fill="#A25711">별도 수동 경로</text>

<!-- 짚어둘 점 -->
<rect x="40" y="604" width="1420" height="102" rx="12" fill="#F6F1E6" stroke="#DCC9A6" stroke-width="1.2"/>
<text x="58" y="628" font-size="12.5" font-weight="700" fill="#7A5E23">짚어둘 점</text>
<text x="58" y="650" font-size="11.5" fill="#6F6357">· backend/tests/**, pytest.ini, scripts/** 만 바뀐 커밋은 배포를 건너뛴다 — 배포 전환마다 생기는 짧은 502 창에 사용자가 걸리지 않게.</text>
<text x="58" y="670" font-size="11.5" fill="#6F6357">· 저장소에 cloudbuild.yaml은 없다. Cloud Build와 Artifact Registry는 gcloud run deploy --source 가 내부에서 태우는 단계다.</text>
<text x="58" y="690" font-size="11.5" fill="#6F6357">· 두 배포 워크플로는 Actions 탭에서 수동 실행(workflow_dispatch)도 된다 — 코드 변경 없이 같은 커밋을 다시 배포할 때 쓴다.</text>
</svg>
